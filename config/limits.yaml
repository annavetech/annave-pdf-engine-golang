# ANNÁVE PDF Engine: Input and Output Limits
#
# Adjust these values to match your deployment constraints.
#
# This file is the embedded default: edit it and rebuild the binary
# (go build ./cmd/cli) to change it for every Engine that does not override
# it.
#
# To change the limits without rebuilding, a caller passes its own YAML file
# in this exact shape to pdfengine.New via WithLimitsFile(path) (library) or
# annave pdf convert --limits-file path (CLI). No external file is read
# unless the caller supplies one this way.

input:
  # Maximum size of the input passed to a single conversion, in bytes.
  #
  # What breaks with wrong values:
  #   Too low:  legitimate DOCX and Jupyter Notebook files get rejected.
  #              A typical DOCX with images is 1–3 MB.
  #              A minimal DOCX is ~10 KB.
  #   Too high: oversized files increase memory use and processing time per conversion.
  #              A 50 MB input at peak load could exhaust available RAM.
  #
  # Common values (bytes):
  #   1 MB  =   1048576   (tight, rejects most DOCX files with images)
  #   2 MB  =   2097152   (moderate, covers plain DOCX and most Markdown)
  #   5 MB  =   5242880   (default, covers most real-world documents)
  #   10 MB =  10485760   (generous, allows large CSV exports)
  #   20 MB =  20971520   (large, allows big Jupyter notebooks)
  #   50 MB =  52428800   (very large, watch memory usage under concurrent load)
  max_file_size_bytes: 5242880

  # Maximum number of Unicode characters in the normalised input string.
  # Applied after the file is decoded to UTF-8 and line endings are normalised.
  # Also bounds YAML aliases: the content they expand to may total at most this many characters,
  # where each value reached through an alias counts as its length in characters plus one.
  #
  # What breaks with wrong values:
  #   Too low:  documents with dense text get rejected mid-conversion.
  #   Too high: large inputs raise heap allocation per conversion.
  #
  # Reference: 500,000 characters ≈ 300–400 pages of 13px body text at A4.
  #
  # Common values:
  #   100000    (tight, short reports, invoices)
  #   500000    (default, covers most documents)
  #   2000000   (large, technical manuals, legal documents; watch memory under load)
  max_input_chars: 500000

document:
  # Maximum number of block-level nodes in a parsed document.
  #
  # One node = one of: paragraph, heading, list, table, code block,
  # blockquote, horizontal rule, or image.
  # A list counts as one node regardless of how many items it has.
  # A table counts as one node regardless of how many rows it has.
  #
  # Example: a document with 50 paragraphs, 5 headings, 3 tables,
  # and 2 code blocks has 60 nodes.
  #
  # What breaks with wrong values:
  #   Too low:  documents with many sections hit the limit and return
  #              ENGINE_ERR_TOO_MANY_NODES.
  #   Too high: adversarially crafted inputs with thousands of nodes
  #              can cause very long layout computation times.
  #
  # Common values:
  #   500     (short reports, invoices)
  #   2000    (default, covers most real-world documents)
  #   10000   (very large technical documentation)
  max_nodes: 2000

  # Maximum number of PDF pages the engine will produce for a single conversion.
  #
  # What breaks with wrong values:
  #   Too low:  long documents are rejected after layout, wasting the
  #              computation already done. Set this at least 2× the longest
  #              document you expect to convert.
  #   Too high: very long documents increase peak memory proportionally.
  #              Each page holds its layout boxes in memory until rendering completes.
  #
  # Reference: 100 pages at A4 / 13px body / 1.65 line height ≈ 10,000 words.
  #
  # Common values:
  #   20      (short reports, enforce page budget)
  #   100     (default)
  #   500     (book-length documents)
  max_pages: 100
