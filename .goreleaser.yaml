# ANNÁVE PDF Engine: release pipeline
#
# Builds the `annave` CLI for darwin/linux, amd64/arm64, publishes a GitHub
# release with checksums, and pushes a Homebrew cask (not `brews`) to the tap.
#
# Run by release.yml only after CI passes for that tag; the GoReleaser
# tool version is pinned there too, not in this file.
#
# Version isn't injected via ldflags: EngineVersion is a const, not a var,
# so the release tag and EngineVersion must be kept in step by hand (see docs/CONTRIBUTING.md).
#
# Binaries are unsigned/unnotarised (no paid Apple dev account), so Gatekeeper
# quarantines them; the post-install hook below strips that attribute.

version: 2

project_name: annave-pdf-engine

builds:
  - id: annave
    main: ./cmd/cli
    binary: annave
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: annave
    ids:
      - annave
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

homebrew_casks:
  - name: annave-pdf-engine
    ids:
      - annave
    binaries:
      - annave
    repository:
      owner: annavetech
      name: homebrew-annave
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://www.annave.tech"
    description: "Convert documents to PDF from the command line (ANNÁVE PDF Engine)"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/annave"]
          end

release:
  github:
    owner: annavetech
    name: annave-pdf-engine-golang
