name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  goreleaser:
    runs-on: ubuntu-latest

    # The default workflow token is read-only, which makes creating the
    # release itself fail with 403. Only contents needs elevating; pushing
    # the cask to the tap repository uses HOMEBREW_TAP_TOKEN instead.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # go.mod declares 1.25 as the minimum supported Go version, but
      # released binaries are built here, not just verified — so this uses
      # "stable" rather than pinning to that minimum. The standard library
      # itself ships security fixes per patch release; building the actual
      # release artifacts with the current Go keeps them off a known-vulnerable
      # toolchain without ever raising the go.mod compatibility promise.
      # .github/workflows/ci.yml verifies the 1.25 minimum still builds.
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: "stable"

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # HOMEBREW_TAP_TOKEN must exist in this repository's secrets and
          # must have write access to annavetech/homebrew-annave — it is
          # what lets GoReleaser push the updated formula to that tap repo.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
