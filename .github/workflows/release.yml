name: Release

# Releases on a v* tag push. The test job runs the full CI first; goreleaser runs only if it passes.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  goreleaser:
    needs: test
    runs-on: ubuntu-latest

    # The default token is read-only; contents:write is needed so creating
    # the release doesn't 403. Pushing the cask uses HOMEBREW_TAP_TOKEN instead.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # Uses "stable" rather than go.mod's 1.26 floor so release binaries build
      # with current Go security fixes; ci.yml verifies the 1.26 floor separately.
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: "stable"

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "v2.18.2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Must exist in this repo's secrets with write access to
          # annavetech/homebrew-annave, for pushing the updated cask.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
