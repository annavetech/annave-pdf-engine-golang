name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor leg reads go.mod's `go` directive so it never drifts from it.
        # Stable leg tracks current Go, matching what release.yml builds with.
        include:
          - leg: floor
            go-version: ""
            go-version-file: go.mod
          - leg: stable
            go-version: "stable"
            go-version-file: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          go-version-file: ${{ matrix.go-version-file }}

      - run: go build ./...
      - run: go vet ./...

      - run: go test ./... -race

      # The floor's standard library can carry advisories that "stable" does not.
      - name: govulncheck (floor)
        if: matrix.leg == 'floor'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

  lint-and-vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      # Official action so findings show on the PR diff; config is .golangci.yml (v2).
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

      # Pinned like above: govulncheck's result depends on the toolchain's
      # standard library as much as this module's deps, so it runs under "stable".
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  python-automation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - run: pip install -r .github/scripts/requirements.txt

      - run: ruff check .github/scripts

      - run: python3 .github/scripts/tests/run_tests.py
