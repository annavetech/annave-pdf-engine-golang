name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # go.mod declares the minimum supported Go version (1.23); CI builds
      # against that version so the compatibility promise it makes to
      # downstream importers is actually verified, not just asserted.
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: "1.23"

      - run: go build ./...
      - run: go vet ./...

      # internal/api includes a deliberate 61-second sleep inside the
      # rate-limit window test; this step is not given a timeout so that
      # test is never cut off.
      - run: go test ./... -race

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
