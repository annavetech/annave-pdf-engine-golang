name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # go.mod declares the minimum supported Go version (1.25); this leg
        # verifies that compatibility promise against downstream importers.
        # The "stable" leg proves the module also builds cleanly on the
        # current Go release, which is what the release workflow actually
        # ships binaries with — the standard library itself carries fixed
        # vulnerabilities per release, so pinning this matrix to a single
        # old toolchain would silently let released binaries fall behind.
        go-version: ["1.25", "stable"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: ${{ matrix.go-version }}

      - run: go build ./...
      - run: go vet ./...

      # internal/api includes a deliberate 61-second sleep inside the
      # rate-limit window test; this step is not given a timeout so that
      # test is never cut off.
      - run: go test ./... -race

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
