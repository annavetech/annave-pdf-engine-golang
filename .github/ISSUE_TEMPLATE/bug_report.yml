name: Bug report
description: Something in pdfengine is broken or behaves differently than documented.
title: "[bug]: "
labels: ["kind/bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What was the expected behavior?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The exact input document, CLI command, or library call used.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - "parser (a specific input format)"
        - "engine (layout, rendering, the AST pipeline)"
        - "cli (the annave command)"
        - "config (style, limits, or message YAML)"
        - "docs"
        - "plugin"
        - "other"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Go version, and pdfengine version (see `annave version` or CHANGELOG.md).
    validations:
      required: false
  - type: textarea
    id: anything-else
    attributes:
      label: Anything else?
    validations:
      required: false
