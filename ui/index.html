<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANNÁVE PDF Engine</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #f5f5f7;
      --surface:   #ffffff;
      --border:    #d2d2d7;
      --text:      #1d1d1f;
      --muted:     #6e6e73;
      --accent:    #0071e3;
      --accent-h:  #0077ed;
      --danger:    #c0392b;
      --danger-bg: #fdf0ef;
      --radius:    12px;
      --mono:      "JetBrains Mono", "SF Mono", "Menlo", monospace;
    }

    body {
      font-family: -apple-system, "SF Pro Display", BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 24px 32px 0;
    }

    header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    header p {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      padding: 20px 32px;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
    }

    @media (max-width: 768px) {
      main { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .panel h2 {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Drop zone */
    #drop-zone {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 28px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      font-size: 13px;
      color: var(--muted);
    }

    #drop-zone.drag-over {
      border-color: var(--accent);
      background: #f0f6ff;
      color: var(--accent);
    }

    #drop-zone span {
      display: block;
      font-size: 24px;
      margin-bottom: 6px;
    }

    #file-input { display: none; }

    #file-name {
      font-size: 12px;
      color: var(--muted);
      font-family: var(--mono);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Text area */
    textarea {
      width: 100%;
      flex: 1;
      min-height: 180px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
      outline: none;
      transition: border-color 0.15s;
    }

    textarea:focus { border-color: var(--accent); }

    /* Controls row */
    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    select {
      flex: 1;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 10px;
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
      outline: none;
      cursor: pointer;
    }

    select:focus { border-color: var(--accent); }

    button#convert-btn {
      height: 36px;
      padding: 0 20px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    button#convert-btn:hover { background: var(--accent-h); }
    button#convert-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Error box */
    #error-box {
      display: none;
      background: var(--danger-bg);
      border: 1px solid #f5c6c3;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 12px;
    }

    #error-code {
      font-family: var(--mono);
      font-weight: 600;
      color: var(--danger);
      margin-bottom: 4px;
    }

    #error-message { color: var(--danger); }

    /* Output panel */
    #output-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #output-toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #download-btn {
      height: 32px;
      padding: 0 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text);
      display: none;
    }

    #download-btn:hover { border-color: var(--accent); color: var(--accent); }

    #pdf-frame {
      flex: 1;
      min-height: 520px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
    }

    #placeholder {
      flex: 1;
      min-height: 520px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 13px;
    }

    footer {
      padding: 16px 32px;
      font-size: 11px;
      color: var(--muted);
      text-align: center;
    }

    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--accent); }
  </style>
</head>
<body>

<header>
  <h1>ANNÁVE PDF Engine</h1>
  <p>Convert any document to PDF — drop a file or paste text below.</p>
</header>

<main>
  <!-- Input panel -->
  <div class="panel">
    <h2>Input</h2>

    <div id="drop-zone" role="button" tabindex="0" aria-label="Drop a file or click to upload">
      Drop a file here, or click to choose
    </div>
    <input type="file" id="file-input"
      accept=".md,.html,.htm,.docx,.csv,.tsv,.json,.yaml,.yml,.xml,.rst,.ipynb,.txt,.png,.jpg,.jpeg,.gif,.webp">
    <div id="file-name"></div>

    <textarea id="text-input" placeholder="Or paste your Markdown, HTML, CSV... here"></textarea>

    <div class="controls">
      <select id="format-select" aria-label="Input format">
        <option value="auto">Auto-detect</option>
        <option value="md">Markdown</option>
        <option value="html">HTML</option>
        <option value="docx">DOCX</option>
        <option value="csv">CSV</option>
        <option value="json">JSON</option>
        <option value="yaml">YAML</option>
        <option value="xml">XML</option>
        <option value="rst">RST</option>
        <option value="ipynb">Jupyter Notebook</option>
        <option value="png">PNG</option>
        <option value="jpg">JPEG</option>
        <option value="gif">GIF</option>
        <option value="webp">WebP</option>
        <option value="txt">Plain text</option>
      </select>
      <button id="convert-btn">Convert to PDF</button>
    </div>

    <div id="error-box">
      <div id="error-code"></div>
      <div id="error-message"></div>
    </div>
  </div>

  <!-- Output panel -->
  <div class="panel" id="output-panel">
    <h2>Output</h2>
    <div id="output-toolbar">
      <button id="download-btn">&#8681; Download PDF</button>
    </div>
    <div id="placeholder">PDF preview will appear here</div>
    <iframe id="pdf-frame" style="display:none" title="PDF preview"></iframe>
  </div>
</main>

<footer>
  Powered by <a href="https://www.annave.tech" target="_blank" rel="noopener">ANNÁVE PDF Engine</a>
</footer>

<script>
  const dropZone    = document.getElementById('drop-zone');
  const fileInput   = document.getElementById('file-input');
  const fileName    = document.getElementById('file-name');
  const textInput   = document.getElementById('text-input');
  const formatSel   = document.getElementById('format-select');
  const convertBtn  = document.getElementById('convert-btn');
  const errorBox    = document.getElementById('error-box');
  const errorCode   = document.getElementById('error-code');
  const errorMsg    = document.getElementById('error-message');
  const placeholder = document.getElementById('placeholder');
  const pdfFrame    = document.getElementById('pdf-frame');
  const downloadBtn = document.getElementById('download-btn');
  const versionEl   = document.getElementById('engine-version');

  let selectedFile = null;
  let pdfObjectURL = null;

  // Fetch engine version from /health
  fetch('/health').then(r => r.json()).then(d => {
    if (d.version) versionEl.textContent = d.version;
  }).catch(() => {});

  // File drop zone
  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') fileInput.click(); });

  dropZone.addEventListener('dragover', e => {
    e.preventDefault();
    dropZone.classList.add('drag-over');
  });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file) setFile(file);
  });

  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) setFile(fileInput.files[0]);
  });

  function setFile(file) {
    selectedFile = file;
    fileName.textContent = file.name;
    textInput.value = '';
    // Auto-set format from extension
    const ext = file.name.split('.').pop().toLowerCase();
    const extMap = {
      md: 'md', markdown: 'md', html: 'html', htm: 'html',
      docx: 'docx', csv: 'csv', tsv: 'csv', json: 'json',
      yaml: 'yaml', yml: 'yaml', xml: 'xml', rst: 'rst',
      ipynb: 'ipynb', txt: 'txt', png: 'png', jpg: 'jpg',
      jpeg: 'jpg', gif: 'gif', webp: 'webp',
    };
    if (extMap[ext]) formatSel.value = extMap[ext];
  }

  textInput.addEventListener('input', () => {
    if (textInput.value) {
      selectedFile = null;
      fileName.textContent = '';
    }
  });

  // Convert
  convertBtn.addEventListener('click', convert);

  async function convert() {
    clearError();
    convertBtn.disabled = true;
    convertBtn.textContent = 'Converting…';

    const format = formatSel.value;

    try {
      let response;

      if (selectedFile) {
        const form = new FormData();
        form.append('file', selectedFile);
        if (format !== 'auto') form.append('format', format);
        response = await fetch('/convert', { method: 'POST', body: form });
      } else {
        const text = textInput.value.trim();
        if (!text) {
          showError('ENGINE_ERR_EMPTY_INPUT', 'No input provided. Drop a file or paste text.');
          return;
        }
        const url = format === 'auto' ? '/convert' : `/convert?format=${format}`;
        response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: text,
        });
      }

      if (!response.ok) {
        const err = await response.json();
        showError(err.error.code, err.error.message);
        return;
      }

      // Version from response header
      const v = response.headers.get('X-Engine-Version');
      if (v) versionEl.textContent = v;

      // Revoke previous object URL
      if (pdfObjectURL) URL.revokeObjectURL(pdfObjectURL);

      const blob = await response.blob();
      pdfObjectURL = URL.createObjectURL(blob);

      placeholder.style.display = 'none';
      pdfFrame.style.display = 'block';
      pdfFrame.src = pdfObjectURL;

      downloadBtn.style.display = 'block';
      downloadBtn.onclick = () => {
        const a = document.createElement('a');
        a.href = pdfObjectURL;
        a.download = selectedFile ? selectedFile.name.replace(/\.[^.]+$/, '.pdf') : 'output.pdf';
        a.click();
      };

    } catch (e) {
      showError('ENGINE_ERR_INTERNAL', 'Network error: ' + e.message);
    } finally {
      convertBtn.disabled = false;
      convertBtn.textContent = 'Convert to PDF';
    }
  }

  function showError(code, message) {
    errorBox.style.display = 'block';
    errorCode.textContent = code;
    errorMsg.textContent = message;
    placeholder.style.display = 'flex';
    pdfFrame.style.display = 'none';
    downloadBtn.style.display = 'none';
  }

  function clearError() {
    errorBox.style.display = 'none';
    errorCode.textContent = '';
    errorMsg.textContent = '';
  }
</script>

</body>
</html>
